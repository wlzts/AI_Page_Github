function sanitizeMeal(m,p){m.ingredients=m.ingredients.map(i=>{const f=foods[i.foodId];if(allowed(f,p))return i;const alt=[...f.substitutes,...Object.values(foods).filter(x=>x.category===f.category).map(x=>x.id)].find(id=>id!==f.id&&allowed(foods[id],p));return alt?{...i,foodId:alt}:null}).filter(Boolean);return m}
function generateWeek(p,t){const week=Array.from({length:7},(_,i)=>({day:i+1,training:i<p.trainingDaysPerWeek,trainingType:i<p.trainingDaysPerWeek?'力量训练':'休息 / 轻活动',meals:clone(variants[i%3]).map(m=>sanitizeMeal(m,p))}));const scale=Math.max(.78,Math.min(1.25,t.targetCalories/dayN(week[0]).calories));week.forEach(d=>d.meals.forEach(m=>m.ingredients.forEach(i=>{if(['蛋白质','主食和碳水','脂肪和坚果'].includes(foods[i.foodId].category)){i.amount=i.unit==='piece'?Math.max(1,Math.round(i.amount*scale)):round5(i.amount*scale)}})));return week}
function shopping(week){const map={};week.forEach(d=>d.meals.forEach(m=>m.ingredients.forEach(i=>{const g=grams(i),f=foods[i.foodId];map[i.foodId]??={foodId:i.foodId,net:0,meals:new Set};map[i.foodId].net+=g;map[i.foodId].meals.add(`周${'一二三四五六日'[d.day-1]} ${m.type}`)})));return Object.values(map).map(x=>{const f=foods[x.foodId],purchase=x.net/f.edibleRate,size=f.packageSizes.find(s=>s>=purchase)||f.packageSizes.at(-1),packs=Math.ceil(purchase/size),unit=f.unit==='ml'?'毫升':'克';return{...x,name:f.name,category:f.category,netUsageGrams:round5(x.net),wasteRate:f.wasteRate,purchaseGrams:round5(purchase),packageSuggestion:f.unit==='piece'?`约 ${Math.ceil(purchase/(f.pieceEdibleGrams||50)/f.edibleRate)} 个`:`${packs} × ${size}${unit}`,cost:round1(purchase/1000*f.pricePerKg),meals:[...x.meals],storage:f.storage,shelfLife:f.shelfLife,freezer:f.freezer,leftoverGrams:Math.max(0,round5(packs*size-purchase))}}).sort((a,b)=>a.category.localeCompare(b.category,'zh-CN'))}
const saved=(()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}})();
const state={page:'home',step:0,day:0,dark:saved?.dark||false,profile:saved?.profile||clone(demo),targets:null,week:saved?.week||null,checked:saved?.checked||{},replace:null,toast:''};
state.targets=calcTargets(state.profile); state.week=state.week||generateWeek(state.profile,state.targets);
function persist(){try{localStorage.setItem(STORE,JSON.stringify({dark:state.dark,profile:state.profile,week:state.week,checked:state.checked}))}catch(e){console.warn('Local storage unavailable; continuing without persistence.')}}
const goalLabel=g=>({gentle_loss:'温和减脂',fat_loss:'减脂保肌',lean_gain:'精益增肌',maintain:'维持体重'}[g]);
const actLabel=a=>({sedentary:'久坐',light:'轻度活动',moderate:'中度活动',high:'高度活动',very_high:'非常活跃'}[a]);
function safety(){const warning=state.profile.age<18||state.targets.bmi<18.5;return `<div class="safety-notice"><span>${icon('♡')}</span><div><h3>健康与安全说明</h3><p>本工具提供的是基于用户输入和通用营养计算方法生成的参考计划，不构成医疗建议、疾病诊断或个体化临床营养治疗。实际营养需求可能因健康状况、药物使用、怀孕、哺乳、代谢情况、训练强度及其他因素而不同。</p>${warning?'<b>建议在医生或注册营养师指导下制定饮食计划。</b>':''}</div></div>`}
function panelHead(t,s,a=''){return `<div class="panel-head"><div><h3>${t}</h3><p>${s}</p></div>${a}</div>`}
function layout(content){const nav=[['home','概览','⌂'],['profile','创建计划','☷'],['meals','每日餐单','♨'],['shopping','采购清单','🛒'],['prep','备餐计划','▦'],['tracking','饮食记录','▥'],['settings','设置','⚙']];return `<div class="app-shell"><aside class="sidebar"><button class="brand" data-page="home"><span class="brand-mark">${icon('叶')}</span><span><b>FitMeal AI</b><small>健身餐计划生成器</small></span></button><nav>${nav.map(([p,l,i])=>`<button data-page="${p}" class="${state.page===p?'active':''}">${icon(i)}<span>${l}</span>${p==='shopping'?`<em>${shopping(state.week).length}</em>`:''}</button>`).join('')}</nav><div class="sidebar-card">${icon('✦')}<b>演示计划已就绪</b><p>基于 28 岁、75 kg、每周力量训练 4 次生成。</p><button data-page="profile">修改数据 ›</button></div><div class="sidebar-foot"><button data-action="theme">${icon(state.dark?'☀':'☾')} ${state.dark?'浅色模式':'深色模式'}</button></div></aside><main class="main"><header class="topbar"><div><span class="eyebrow">个人计划 · ${goalLabel(state.profile.goal)}</span><h1>${nav.find(n=>n[0]===state.page)?.[1]}</h1></div><div class="top-actions"><span class="saved">${icon('✓')} 已自动保存</span><button class="icon-button" data-action="theme">${icon(state.dark?'☀':'☾')}</button><button class="primary compact" data-page="profile">${icon('+')} 新计划</button></div></header>${content}</main><nav class="mobile-nav">${nav.slice(0,5).map(([p,l,i])=>`<button data-page="${p}" class="${state.page===p?'active':''}">${icon(i)}<span>${l}</span></button>`).join('')}</nav>${state.replace?replaceModal():''}${state.toast?`<div class="toast">${icon('✓')} ${state.toast}</div>`:''}</div>`}
function stat(i,l,v,n){return `<div class="stat-card"><span class="stat-icon">${icon(i)}</span><div><small>${l}</small><strong>${v}</strong><p>${n}</p></div></div>`}
function homePage(){const t=state.targets,d=dayN(state.week[0]),cost=shopping(state.week).reduce((s,x)=>s+x.cost,0),mc=t.protein*4+t.carbs*4+t.fat*9;const macro=(l,v,p,c)=>`<div class="macro-item"><div><span><i class="${c}"></i>${l}</span><b>${v}g</b></div><div class="progress"><i class="${c}" style="width:${p}%"></i></div><small>${Math.round(p)}% 热量占比</small></div>`;return `<div class="page-content home-page"><section class="hero-card"><div class="hero-copy"><span class="pill">${icon('✦')} AI 辅助 · 程序化营养计算</span><h2>不用再计算热量，<br><span>不用再纠结吃什么。</span></h2><p>根据你的身体数据、训练目标和饮食偏好，生成精准到克的每日健身餐与采购清单。</p><div class="hero-actions"><button class="primary" data-page="profile">开始制定计划 ›</button><button class="secondary" data-page="meals">查看演示餐单</button></div><div class="trust-row"><span>✓ 可编辑克数</span><span>✓ 排除过敏原</span><span>✓ 本地自动保存</span></div></div><div class="hero-visual"><div class="plate"><span>🥗</span><i></i><b></b></div><div class="float-card fc1">${icon('🔥')}<div><strong>${fmt(t.targetCalories)}</strong><small>每日千卡</small></div></div><div class="float-card fc2">${icon('🏋')}<div><strong>${t.protein}g</strong><small>蛋白质目标</small></div></div><div class="float-card fc3">${icon('🛒')}<div><strong>¥${fmt(cost)}</strong><small>每周预计</small></div></div></div></section><section class="stat-grid">${stat('◉','基础代谢率 BMR',`${t.bmr} kcal`,'Mifflin-St Jeor 估算')}${stat('↗','每日总消耗 TDEE',`${t.tdee} kcal`,`${actLabel(state.profile.activityLevel)}活动系数`)}${stat('◎','每日目标热量',`${t.targetCalories} kcal`,'允许手动调整')}${stat('↓','预计每周变化',`${t.weeklyChangeKg} kg`,'仅作趋势参考')}</section><section class="dashboard-grid"><div class="panel nutrition-panel">${panelHead('每日营养目标','所有数值均为估算，可随时手动调整','<button data-page="profile">✎ 调整</button>')}<div class="nutrition-main"><div class="cal-ring" style="--p:${Math.min(100,d.calories/t.targetCalories*100)}%"><div><strong>${t.targetCalories}</strong><span>目标千卡</span></div></div><div class="macro-list">${macro('蛋白质',t.protein,t.protein*4/mc*100,'protein')}${macro('碳水化合物',t.carbs,t.carbs*4/mc*100,'carbs')}${macro('脂肪',t.fat,t.fat*9/mc*100,'fat')}</div></div><div class="micro-row"><span>🌾 膳食纤维 <b>${t.fiber}g</b></span><span>💧 饮水参考 <b>${fmt(t.waterMl/1000,1)}L</b></span><span>♡ BMI <b>${t.bmi}</b></span></div></div><div class="panel today-panel">${panelHead('今日餐单预览','第 1 天 · 力量训练日','<button data-page="meals">查看全部 ›</button>')}${state.week[0].meals.map(m=>`<div class="meal-preview"><span class="meal-emoji">${m.emoji}</span><div><b>${m.name}</b><small>${m.type} · 约 ${m.time} 分钟</small></div><em>${m.type.includes('加餐')?'低脂':'高蛋白'}</em></div>`).join('')}</div></section>${safety()}</div>`}

function field(label,html){return `<label class="field"><span>${label}</span>${html}</label>`}

function profilePage(){const p=state.profile,t=state.targets,steps=['身体信息','健身目标','训练情况','饮食偏好','个性设置'];let body='';if(state.step===0)body=`<div class="section-title"><span>${icon('♡')}</span><div><h2>身体信息</h2><p>用于估算基础代谢率和每日能量需求。</p></div></div><div class="form-grid">${field('性别',`<div class="select-wrap"><select data-profile="sex">${opts([['male','男'],['female','女'],['other','不便透露 / 自定义']],p.sex)}</select></div>`)}${field('年龄',num('age',p.age,16,80,'岁'))}${field('身高',num('heightCm',p.heightCm,120,230,'厘米'))}${field('当前体重',num('currentWeightKg',p.currentWeightKg,30,250,'公斤'))}${field('目标体重',num('targetWeightKg',p.targetWeightKg,30,250,'公斤'))}${field('体脂率（可选）',num('bodyFatPercentage',p.bodyFatPercentage||0,0,60,'%'))}</div>${p.age<18?'<div class="inline-warning">⚠ 未成年人建议在家长、医生或注册营养师指导下调整饮食。</div>':''}<div class="info-box">ⓘ 当前 BMI 约为 <b>${t.bmi}</b>。BMI 与体脂率都只能作为参考。</div>`;if(state.step===1)body=`<div class="section-title"><span>${icon('◎')}</span><div><h2>选择主要目标</h2><p>系统会据此设置初始热量范围，之后仍可修改。</p></div></div><div class="choice-grid">${[['gentle_loss','温和减脂','TDEE -10% 至 -15%','🌿'],['fat_loss','减脂保肌','TDEE -15% 至 -20%','↓'],['lean_gain','精益增肌','TDEE +5% 至 +10%','🏋'],['maintain','维持体重','接近 TDEE','↔']].map(([v,l,d,i])=>`<button class="choice-card ${p.goal===v?'selected':''}" data-profile-click="goal" data-value="${v}">${icon(i)}<b>${l}</b><span>${d}</span>${p.goal===v?icon('✓'):''}</button>`).join('')}</div><div class="goal-summary"><div><span>当前体重</span><b>${p.currentWeightKg} kg</b></div>›<div><span>目标体重</span><b>${p.targetWeightKg} kg</b></div><div class="goal-note">ⓘ 按当前设置，预计每周体重变化约 <b>${t.weeklyChangeKg} kg</b>，仅作参考。</div></div>`;if(state.step===2)body=`<div class="section-title"><span>${icon('🏋')}</span><div><h2>训练与日常活动</h2><p>活动系数会影响 TDEE 估算。</p></div></div>${field('日常活动水平',`<div class="radio-list">${[['sedentary','久坐','大部分时间坐着，很少运动'],['light','轻度活动','每周运动 1—2 次'],['moderate','中度活动','每周运动 3—4 次'],['high','高度活动','每周运动 5—6 次'],['very_high','非常活跃','高强度训练或体力劳动']].map(([v,l,d])=>`<button data-profile-click="activityLevel" data-value="${v}" class="${p.activityLevel===v?'selected':''}"><i></i><span><b>${l}</b><small>${d}</small></span></button>`).join('')}</div>`)}<div class="form-grid">${field('每周训练',num('trainingDaysPerWeek',p.trainingDaysPerWeek,0,7,'天'))}${field('每次训练',num('trainingMinutes',p.trainingMinutes,0,240,'分钟'))}${field('训练时间',`<div class="select-wrap"><select data-profile="trainingTime">${opts([['morning','早晨'],['noon','中午'],['afternoon','下午'],['evening','晚上'],['variable','不固定']],p.trainingTime)}</select></div>`)}</div>${field('训练类型（可多选）',chips('trainingTypes',['力量训练','健美训练','跑步','骑行','游泳','综合体能','CrossFit','瑜伽','普拉提'],p.trainingTypes))}`;if(state.step===3)body=`<div class="section-title"><span>${icon('🥗')}</span><div><h2>饮食偏好与限制</h2><p>过敏原和不喜欢的食物拥有最高排除优先级。</p></div></div><div class="form-grid">${field('饮食模式',`<div class="select-wrap"><select data-profile="dietType">${opts(['普通高蛋白饮食','普通均衡饮食','低碳饮食','地中海饮食','蛋奶素','纯素','无麸质','无乳糖','清真饮食'].map(x=>[x,x]),p.dietType)}</select></div>`)}${field('不喜欢的食物',`<input data-text-list="dislikedFoods" value="${p.dislikedFoods.join('、')}" placeholder="例如：香菜、芹菜">`)}${field('喜欢的食物',`<input data-text-list="preferredFoods" value="${p.preferredFoods.join('、')}" placeholder="例如：鸡蛋、牛肉、米饭">`)}</div>${field('食物过敏',chips('allergies',['牛奶','鸡蛋','花生','坚果','大豆','小麦','麸质','鱼类','贝类','芝麻'],p.allergies,'danger'))}`;if(state.step===4)body=`<div class="section-title"><span>${icon('⚙')}</span><div><h2>个性化设置</h2><p>控制餐数、预算、时间、厨具和重量显示。</p></div></div><div class="form-grid">${field('每日餐数',num('mealsPerDay',p.mealsPerDay,2,6,'餐'))}${field('每日预算',num('dailyBudget',p.dailyBudget,10,1000,'元'))}${field('每餐烹饪时间',`<div class="select-wrap"><select data-profile="cookingTime">${opts([['10','不超过 10 分钟'],['20','不超过 20 分钟'],['30','不超过 30 分钟'],['60','时间不限']],p.cookingTime)}</select></div>`)}${field('烹饪能力',`<div class="select-wrap"><select data-profile="cookingSkill">${opts(['完全不会做饭','初级','中级','熟练'].map(x=>[x,x]),p.cookingSkill)}</select></div>`)}${field('重量显示',`<div class="select-wrap"><select data-profile="weightDisplay">${opts([['raw','全部按生重显示'],['cooked','全部按熟重显示'],['both','生重和熟重同时显示']],p.weightDisplay)}</select></div>`)}${field('用餐场景',`<div class="select-wrap"><select data-profile="mealScene">${opts(['在家吃','带便当','公司食堂','学校食堂','经常外卖','经常出差','宿舍条件','混合场景'].map(x=>[x,x]),p.mealScene)}</select></div>`)}</div>${field('可用厨具',chips('tools',['电饭锅','炒锅','汤锅','烤箱','空气炸锅','微波炉','蒸锅','只有简单厨具','无法开火'],p.tools))}<label class="switch-row"><span><b>减少浪费模式</b><small>重复使用基础食材、贴近常见包装并安排剩余食材</small></span><input type="checkbox" data-profile="wasteReduction" ${p.wasteReduction?'checked':''}><i></i></label>`;return `<div class="page-content form-page"><div class="stepper">${steps.map((s,i)=>`<button data-step="${i}" class="${i===state.step?'active':''} ${i<state.step?'done':''}"><span>${i<state.step?'✓':i+1}</span><b>${s}</b><i></i></button>`).join('')}</div><div class="form-layout"><section class="form-panel">${body}<div class="form-buttons"><button class="secondary" data-step="${Math.max(0,state.step-1)}" ${state.step===0?'disabled':''}>‹ 上一步</button>${state.step<4?`<button class="primary" data-step="${state.step+1}">下一步 ›</button>`:`<button class="primary generate" data-action="generate">✦ 生成 7 天计划</button>`}</div></section><aside class="live-preview"><span class="eyebrow">实时计算预览</span><h3>${t.targetCalories} <small>kcal / 天</small></h3>${['protein','carbs','fat'].map((k,i)=>`<div class="preview-bars"><div><span>${['蛋白质','碳水','脂肪'][i]}<b>${t[k]}g</b></span><i><em class="${k}" style="width:${Math.min(100,t[k]*[4,4,9][i]/t.targetCalories*100)}%"></em></i></div></div>`).join('')}<div class="calc-details"><div><span>BMR</span><b>${t.bmr} kcal</b></div><div><span>TDEE</span><b>${t.tdee} kcal</b></div><div><span>饮水参考</span><b>${fmt(t.waterMl/1000,1)} L</b></div><div><span>膳食纤维</span><b>${t.fiber} g</b></div></div><p class="estimate-note">ⓘ 该数值属于估算结果，实际消耗会受到体成分、睡眠、压力、训练强度和个体差异影响。</p></aside></div></div>`}
function metric(l,a,t,u,i){const pct=a/t*100;return `<div><span>${icon(i)}${l}</span><b>${fmt(a,1)} <small>/ ${fmt(t)} ${u}</small></b><i><em style="width:${Math.min(100,pct)}%"></em></i><p>${pct>=97&&pct<=103?'在目标范围内':pct<97?'低于目标':'高于目标'}</p></div>`}
function mealCard(m){const n=mealN(m),cost=m.ingredients.reduce((s,i)=>s+grams(i)/foods[i.foodId].edibleRate/1000*foods[i.foodId].pricePerKg,0);return `<article class="meal-card"><div class="meal-banner"><span>${m.emoji}</span><div><em>${m.type}</em><h3>${m.name}</h3><p>◷ ${m.time} 分钟 · ${m.difficulty} · ${m.portable?'适合便当':'建议现做'}</p></div><div class="meal-kcal"><strong>${Math.round(n.calories)}</strong><small>kcal</small></div></div><div class="meal-macros"><span>蛋白质 <b>${fmt(n.protein,1)}g</b></span><span>碳水 <b>${fmt(n.carbs,1)}g</b></span><span>脂肪 <b>${fmt(n.fat,1)}g</b></span><span>预计成本 <b>¥${fmt(cost,1)}</b></span></div><details open><summary>食材克数与制作步骤</summary><div class="meal-body"><div class="ingredients-section"><div class="subhead"><h4>食材与重量</h4><small>点击克数可直接修改</small></div><div class="ingredient-table"><div class="ingredient-row table-head"><span>食材</span><span>实际使用</span><span>重量标准</span><span>熟重 / 购买重</span><span>营养</span><span></span></div>${m.ingredients.map((i,idx)=>{const f=foods[i.foodId],g=grams(i),x=ingN(i);return `<div class="ingredient-row"><span><b>${f.name}</b><small>${f.category}</small></span><span class="edit-amount"><input data-amount data-meal="${m.id}" data-index="${idx}" type="number" value="${i.amount}" step="${i.unit==='piece'?1:5}"><em>${i.unit==='piece'?'个':i.unit}</em>${i.unit==='piece'?`<small>≈ ${g}g 可食</small>`:''}</span><span><i class="weight-tag">${wt(i.foodId)}</i></span><span><b>熟约 ${round5(g*f.cookingYield)}g</b><small>购买约 ${round5(g/f.edibleRate)}${f.unit==='ml'?'ml':'g'}</small></span><span><b>${Math.round(x.calories)} kcal</b><small>P ${fmt(x.protein,1)} · C ${fmt(x.carbs,1)} · F ${fmt(x.fat,1)}</small></span><span><button class="replace-btn" data-replace="${m.id}:${idx}">⇄ 替换</button></span></div>`}).join('')}</div></div><div class="steps-section"><h4>制作步骤</h4><ol>${m.steps.map((s,i)=>`<li><span>${i+1}</span><p>${s}</p></li>`).join('')}</ol><div class="meal-note">ⓘ 肉类、蛋类与海鲜应加热至安全熟度；实际时间需按设备和食材厚度调整。</div></div></div></details><div class="meal-footer"><div><button data-lock="${m.id}" class="${m.locked?'active':''}">▣ ${m.locked?'已锁定':'锁定这一餐'}</button><button>♡ 收藏</button><button>↻ 重新生成</button></div><span>${m.freezerFriendly?'✓ 适合冷冻分装':'建议冷藏短期保存'}</span></div></article>`}
function mealsPage(){const d=state.week[state.day],n=dayN(d),t=state.targets;return `<div class="page-content meals-page"><div class="days-tabs">${state.week.map((x,i)=>`<button data-day="${i}" class="${state.day===i?'active':''}"><small>周${'一二三四五六日'[i]}</small><b>${x.training?'训练日':'休息日'}</b><span>${Math.round(dayN(x).calories)} kcal</span></button>`).join('')}</div><div class="day-header"><div><span class="day-type ${d.training?'training':''}">${d.training?'🏋 力量训练日':'🌿 休息 / 轻活动日'}</span><h2>第 ${d.day} 天 · ${d.trainingType}</h2><p>食材默认：米面按干重、肉鱼按生重、蔬果按可食生重；所有营养数值均为估算。</p></div><div class="day-actions"><button class="secondary" data-action="print">▣ 打印</button><button class="secondary" data-action="copy">☷ 复制餐单</button></div></div><div class="day-macros">${metric('热量',n.calories,t.targetCalories,'kcal','🔥')}${metric('蛋白质',n.protein,t.protein,'g','🍗')}${metric('碳水',n.carbs,t.carbs,'g','🌾')}${metric('脂肪',n.fat,t.fat,'g','💧')}</div><div class="meal-list">${d.meals.map(mealCard).join('')}</div><div class="totals-table panel">${panelHead('当日营养合计','目标值与当前食谱合计的差异')}<div class="comparison-row head"><span>项目</span><span>目标</span><span>食谱合计</span><span>差值</span></div>${[['热量',t.targetCalories,n.calories,'kcal'],['蛋白质',t.protein,n.protein,'g'],['碳水',t.carbs,n.carbs,'g'],['脂肪',t.fat,n.fat,'g']].map(([l,a,b,u])=>{const diff=b-a;return `<div class="comparison-row"><b>${l}</b><span>${fmt(a)} ${u}</span><span>${fmt(b,1)} ${u}</span><em class="${Math.abs(diff/a)<=.03?'good':''}">${diff>0?'+':''}${fmt(diff,1)} ${u}</em></div>`}).join('')}<p class="data-note">食材品牌、产地、成熟度和烹饪方式不同，实际营养值可能存在差异。每日计划允许目标值上下约 3% 的小范围误差。</p></div>${safety()}</div>`}
function replaceModal(){const [mealId,index]=state.replace.split(':'),m=state.week[state.day].meals.find(x=>x.id===mealId),old=m.ingredients[+index],f=foods[old.foodId],oldN=ingN(old);const cand=[...new Set([...f.substitutes,...Object.values(foods).filter(x=>x.category===f.category).map(x=>x.id)])].filter(id=>id!==f.id&&allowed(foods[id],state.profile)).slice(0,6);return `<div class="modal-backdrop" data-action="close-modal"><div class="modal" data-modal><div class="modal-head"><div><span class="eyebrow">营养等价替换</span><h3>替换「${f.name}」</h3><p>系统会按主要营养素重新计算建议克数，而不是固定一比一替换。</p></div><button class="icon-button" data-action="close-modal">×</button></div><div class="replace-current"><div><b>${f.name}</b><span>${old.amount}${old.unit==='piece'?'个':old.unit} · ${wt(f.id)}</span></div><div><span>${Math.round(oldN.calories)} kcal</span><span>P ${fmt(oldN.protein,1)}g</span><span>C ${fmt(oldN.carbs,1)}g</span><span>F ${fmt(oldN.fat,1)}g</span></div></div><div class="replace-list">${cand.map(id=>{const nf=foods[id],key=nf.category==='蛋白质'?'protein':nf.category==='主食和碳水'?'carbs':nf.category==='脂肪和坚果'?'fat':'calories',amount=round5((oldN[key]||oldN.calories)/Math.max(.001,(nf.per100[key]||nf.per100.calories)/100));return `<button data-select-food="${id}"><span class="food-icon">${nf.category==='蛋白质'?'🍗':nf.category==='主食和碳水'?'🍚':nf.category==='蔬菜'?'🥦':'🥜'}</span><div><b>${nf.name}</b><small>建议约 ${amount}g · ${wt(id)}</small></div><div><span>${Math.round(nf.per100.calories*amount/100)} kcal</span><small>${nf.storage}</small></div><span>›</span></button>`}).join('')}</div><p class="modal-note">⚠ 替换建议基于模拟数据库。过敏原、饮食模式与品牌营养标签应在正式数据库接入后再次校验。</p></div></div>`}
function shoppingPage(){const list=shopping(state.week),groups=[...new Set(list.map(x=>x.category))],cost=list.reduce((s,x)=>s+x.cost,0),budget=state.profile.dailyBudget*7,done=list.filter(x=>state.checked[x.foodId]).length;return `<div class="page-content shopping-page"><div class="list-toolbar"><div><span class="eyebrow">7 天合并清单</span><h2>按超市区域整理的一周采购</h2><p>净使用量与建议购买量已分开，并包含包装、损耗、保存和预计剩余。</p></div><div><button class="secondary" data-action="print">▣ 打印</button><button class="primary" data-action="csv">↓ 导出 CSV</button></div></div><div class="shopping-stats"><div>🛒<span><small>采购项目</small><b>${list.length} 种</b></span></div><div>✓<span><small>已完成</small><b>${done} / ${list.length}</b></span></div><div>¥<span><small>预计成本</small><b>¥${fmt(cost,1)}</b></span></div><div class="${cost>budget?'over':''}">◎<span><small>每周预算</small><b>¥${budget}</b></span></div></div>${cost>budget?`<div class="inline-warning">⚠ 当前预计成本超过每周预算约 ¥${fmt(cost-budget,1)}。可优先将牛肉、蓝莓或虾替换为鸡胸肉、当季水果或豆腐。</div>`:''}<div class="shopping-groups">${groups.map(g=>`<section class="shopping-group"><div class="group-title"><span>${g==='蛋白质'?'🍗':g==='主食和碳水'?'🌾':g==='蔬菜'?'🥦':g==='水果'?'🍎':'🧂'}</span><h3>${g}</h3><em>${list.filter(x=>x.category===g).length} 项</em></div>${list.filter(x=>x.category===g).map(x=>`<div class="shopping-item ${state.checked[x.foodId]?'checked':''}"><button class="check-box" data-check="${x.foodId}">${state.checked[x.foodId]?'✓':''}</button><div class="shop-name"><b>${x.name}</b><small>${x.meals.slice(0,3).join('、')}${x.meals.length>3?` 等 ${x.meals.length} 餐`:''}</small></div><div><span>净使用量</span><b>${x.netUsageGrams} g</b></div><div><span>损耗</span><b>${Math.round(x.wasteRate*100)}%</b></div><div><span>建议购买</span><b>${x.purchaseGrams} g</b></div><div><span>推荐包装</span><b>${x.packageSuggestion}</b></div><div><span>预计成本</span><b>¥${x.cost}</b></div><button class="details">⌄</button><div class="shop-details"><span><b>保存：</b>${x.storage}</span><span><b>保质参考：</b>${x.shelfLife}</span><span><b>可冷冻：</b>${x.freezer?'可以':'不建议'}</span><span><b>预计剩余：</b>${x.leftoverGrams}g</span></div></div>`).join('')}</section>`).join('')}</div><div class="waste-card"><div><span>🌿</span><div><h3>减少浪费模式已开启</h3><p>系统优先重复使用基础食材，并按常见包装规格计算预计剩余量。</p></div></div><ul>${list.filter(x=>x.leftoverGrams>0).sort((a,b)=>b.leftoverGrams-a.leftoverGrams).slice(0,3).map(x=>`<li>购买 <b>${x.packageSuggestion}</b> 的${x.name}，预计剩余 <b>${x.leftoverGrams}g</b>；建议${x.freezer?'分装冷冻或加入后续餐食':'在保质期内优先使用'}。</li>`).join('')}</ul></div></div>`}
function prepPage(){const list=shopping(state.week),protein=list.filter(x=>x.category==='蛋白质').slice(0,4),carbs=list.filter(x=>x.category==='主食和碳水').slice(0,3),veg=list.filter(x=>x.category==='蔬菜').slice(0,5);const step=(n,t,time,items)=>`<div class="prep-step"><span>${n}</span><div><div class="prep-title"><h3>${t}</h3><em>◷ ${time}</em></div><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;return `<div class="page-content"><div class="list-toolbar"><div><span class="eyebrow">周末集中备餐</span><h2>一次处理，分装一周基础食材</h2><p>未来 2 天的食物冷藏，其余分装冷冻；酱汁建议单独保存。</p></div><button class="secondary" data-action="print">▣ 打印任务</button></div><div class="prep-summary"><div>◷<span><small>预计总处理时间</small><b>约 2 小时 10 分钟</b></span></div><div>♨<span><small>使用厨具</small><b>电饭锅、空气炸锅、蒸锅</b></span></div><div>▦<span><small>建议分装</small><b>14—18 个餐盒</b></span></div></div><div class="prep-timeline">${step('01','清点与称重','15 分钟',[...protein,...carbs,...veg].slice(0,6).map(x=>`${x.name} ${x.netUsageGrams}g`))}${step('02','批量烹饪主食','35 分钟',carbs.map(x=>`${x.name}：按干重 / 可食生重称取 ${x.netUsageGrams}g，熟后重新称总重并平均分装。`))}${step('03','处理蛋白质','45 分钟',protein.map(x=>`${x.name}：净使用 ${x.netUsageGrams}g；分批烹饪至完全熟透，按餐次标签分装。`))}${step('04','蔬菜与冷却','25 分钟',veg.map(x=>`${x.name}：清洗后可食生重 ${x.netUsageGrams}g，蒸 / 烤至适口，尽快摊开冷却。`))}${step('05','分装与保存','10 分钟',['每盒标注日期、餐次、食材熟重和建议食用日期。','2 天内食用部分冷藏，其余快速冷却后冷冻。','复热前确认容器适用；冷冻餐建议提前一晚移至冷藏解冻。'])}</div><div class="meal-note">ⓘ 批量备餐的可保存时间会受到食材、冷却速度、冰箱温度与卫生操作影响；出现异味、黏液或异常颜色时不要食用。</div></div>`}
function trackingPage(){const data=[75,74.8,74.9,74.5,74.3,74.4,74.1],t=state.targets;return `<div class="page-content"><div class="list-toolbar"><div><span class="eyebrow">趋势优先，不看单日波动</span><h2>饮食记录与计划完成度</h2><p>演示数据用于展示交互；体重变化应结合 2—4 周趋势观察。</p></div><button class="primary">+ 记录今天</button></div><div class="tracking-grid"><div class="panel chart-card">${panelHead('最近 7 天体重趋势','公斤 · 演示记录')}<div class="simple-chart">${data.map((v,i)=>`<div style="height:${35+(75-v)*42}%"><i></i><span>${v}</span><small>周${'一二三四五六日'[i]}</small></div>`).join('')}</div></div><div class="panel completion-card">${panelHead('今日完成度','第 1 天 · 力量训练日')}${[['热量',96],['蛋白质',101],['饮水',78],['餐单',75]].map(([l,v])=>`<div class="mini-progress"><span style="--v:${Math.min(100,v)}%"><b>${v}%</b></span><small>${l}</small></div>`).join('')}</div></div><div class="record-table panel">${panelHead('最近记录','实际食用克数可用于覆盖计划值')}<div class="record-row head"><span>日期</span><span>体重</span><span>热量</span><span>蛋白质</span><span>步数</span><span>睡眠</span><span>完成率</span></div>${state.week.slice(0,5).map((d,i)=>`<div class="record-row"><b>8 月 ${5-i} 日</b><span>${data[6-i]} kg</span><span>${Math.round(t.targetCalories*(.93+i*.015))} kcal</span><span>${Math.round(t.protein*(.9+i*.02))} g</span><span>${7200+i*630}</span><span>${(6.6+i*.15).toFixed(1)} h</span><em>${82+i*3}%</em></div>`).join('')}</div><div class="info-box">ⓘ 单日体重可能因水分、盐分、糖原、训练与消化内容物而变化，不能据此直接判断增脂或减脂。</div></div>`}
function settingsPage(){const p=state.profile;return `<div class="page-content settings-page"><section class="panel">${panelHead('显示与单位','偏好会保存在当前浏览器中')}<label class="setting-row"><span>${icon('☾')}<div><b>深色模式</b><small>降低弱光环境下的屏幕亮度</small></div></span><input type="checkbox" data-action="theme-check" ${state.dark?'checked':''}><i></i></label><label class="setting-row"><span>${icon('◉')}<div><b>重量显示</b><small>生重、熟重或同时显示</small></div></span><div class="select-wrap"><select data-profile="weightDisplay">${opts([['raw','生重'],['cooked','熟重'],['both','生重 + 熟重']],p.weightDisplay)}</select></div></label></section><section class="panel">${panelHead('数据与接口','当前版本使用内置模拟食材数据库')}<div class="api-box"><div><span>↗</span><div><b>NutritionDataProvider</b><small>预留真实营养数据库适配器</small></div></div><em>Mock / 本地</em></div><div class="api-box"><div><span>✓</span><div><b>LocalStorage</b><small>未登录用户的表单、计划和勾选状态</small></div></div><em>已启用</em></div></section><section class="panel danger-zone">${panelHead('重置演示数据','恢复默认男性 28 岁、75 kg、减脂保肌计划')}<button class="danger-button" data-action="reset">♲ 恢复默认数据</button></section>${safety()}</div>`}
function page(){return{home:homePage,profile:profilePage,meals:mealsPage,shopping:shoppingPage,prep:prepPage,tracking:trackingPage,settings:settingsPage}[state.page]()}
function render(){document.documentElement.dataset.theme=state.dark?'dark':'light';$('#root').innerHTML=layout(page());bindInputs()}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';render()},1800)}
function bindInputs(){$$('[data-profile]').forEach(el=>el.addEventListener('change',e=>{const k=e.target.dataset.profile;let v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(['age','heightCm','currentWeightKg','targetWeightKg','bodyFatPercentage','trainingDaysPerWeek','trainingMinutes','mealsPerDay','dailyBudget','cookingTime'].includes(k))v=Number(v);state.profile[k]=v;state.targets=calcTargets(state.profile);persist();render()}));$$('[data-text-list]').forEach(el=>el.addEventListener('change',e=>{state.profile[e.target.dataset.textList]=e.target.value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);persist();render()}));$$('[data-amount]').forEach(el=>el.addEventListener('change',e=>{const m=state.week[state.day].meals.find(x=>x.id===e.target.dataset.meal);m.ingredients[+e.target.dataset.index].amount=Math.max(1,Number(e.target.value));persist();render()}))}
document.addEventListener('click', (e) => {
  const target = e.target.closest('button,[data-action]');
  if (!target) return;

  if (target.dataset.page) {
    state.page = target.dataset.page;
    state.replace = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (target.dataset.step !== undefined) {
    state.step = Number(target.dataset.step);
    render();
    return;
  }
  if (target.dataset.profileClick) {
    state.profile[target.dataset.profileClick] = target.dataset.value;
    state.targets = calcTargets(state.profile);
    persist();
    render();
    return;
  }
  if (target.dataset.toggle) {
    const key = target.dataset.toggle;
    const value = target.dataset.value;
    const arr = state.profile[key];
    state.profile[key] = arr.includes(value) ? arr.filter(x => x !== value) : [...arr, value];
    persist();
    render();
    return;
  }
  if (target.dataset.day !== undefined) {
    state.day = Number(target.dataset.day);
    render();
    return;
  }
  if (target.dataset.replace) {
    state.replace = target.dataset.replace;
    render();
    return;
  }
  if (target.dataset.selectFood) {
    const [mealId, indexText] = state.replace.split(':');
    const mealItem = state.week[state.day].meals.find(x => x.id === mealId);
    const index = Number(indexText);
    const old = mealItem.ingredients[index];
    const newFood = foods[target.dataset.selectFood];
    const oldNutrition = ingN(old);
    const key = newFood.category === '蛋白质' ? 'protein'
      : newFood.category === '主食和碳水' ? 'carbs'
      : newFood.category === '脂肪和坚果' ? 'fat' : 'calories';
    const targetNutrition = oldNutrition[key] || oldNutrition.calories;
    const perGram = (newFood.per100[key] || newFood.per100.calories) / 100;
    const suggestedGrams = round5(targetNutrition / Math.max(0.001, perGram));
    const isPiece = newFood.unit === 'piece';
    mealItem.ingredients[index] = {
      foodId: newFood.id,
      amount: isPiece ? Math.max(1, Math.round(suggestedGrams / (newFood.pieceEdibleGrams || 50))) : suggestedGrams,
      unit: isPiece ? 'piece' : (newFood.unit === 'ml' ? 'ml' : 'g')
    };
    state.replace = null;
    persist();
    toast('已按主要营养素重新计算替换克数');
    return;
  }
  if (target.dataset.lock) {
    const mealItem = state.week[state.day].meals.find(x => x.id === target.dataset.lock);
    mealItem.locked = !mealItem.locked;
    persist();
    render();
    return;
  }
  if (target.dataset.check) {
    const id = target.dataset.check;
    state.checked[id] = !state.checked[id];
    persist();
    render();
    return;
  }

  switch (target.dataset.action) {
    case 'theme':
      state.dark = !state.dark;
      persist();
      render();
      break;
    case 'theme-check':
      state.dark = target.checked;
      persist();
      render();
      break;
    case 'generate':
      document.body.insertAdjacentHTML('beforeend', '<div id="loading" class="loading-overlay"><div class="loader-card"><span class="loader-orbit">↻</span><h3>正在组合你的健身餐</h3><p>核对过敏原、热量、蛋白质、预算与食材损耗…</p><div class="loading-bar"><i></i></div></div></div>');
      setTimeout(() => {
        state.targets = calcTargets(state.profile);
        state.week = generateWeek(state.profile, state.targets);
        state.day = 0;
        state.page = 'meals';
        persist();
        $('#loading')?.remove();
        toast('新计划已生成并保存到本地');
      }, 800);
      break;
    case 'close-modal':
      state.replace = null;
      render();
      break;
    case 'print':
      window.print();
      break;
    case 'copy':
      navigator.clipboard?.writeText(state.week[state.day].meals.map(m => `${m.type}：${m.name}`).join('\n'));
      toast('餐单已复制');
      break;
    case 'csv':
      exportCsv();
      break;
    case 'reset':
      state.profile = clone(demo);
      state.targets = calcTargets(state.profile);
      state.week = generateWeek(state.profile, state.targets);
      state.checked = {};
      persist();
      toast('已恢复演示数据');
      break;
  }
});

function exportCsv(){const rows=[['类别','食材','净使用量(g/ml)','损耗率','建议购买量(g/ml)','推荐包装','预计成本','保存方法'],...shopping(state.week).map(x=>[x.category,x.name,x.netUsageGrams,`${Math.round(x.wasteRate*100)}%`,x.purchaseGrams,x.packageSuggestion,x.cost,x.storage])],csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='FitMeal-AI-一周采购清单.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('采购清单 CSV 已导出')}
render();
})();
