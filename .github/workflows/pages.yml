name: Deploy AI_Page to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------
      # Build Stop Motion Studio
      # ---------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/stop-motion-studio-github/package.json

      - name: Install Stop Motion Studio dependencies
        working-directory: projects/stop-motion-studio-github
        run: npm install

      - name: Build Stop Motion Studio
        working-directory: projects/stop-motion-studio-github
        run: npm run build

      # ---------------------------------------
      # Build the main static website
      # ---------------------------------------
      - name: Build static Pages bundle
        run: |
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'api/' \
            --exclude 'server-lib/' \
            --exclude 'package.json' \
            --exclude 'vercel.json' \
            --exclude '.env*' \
            --exclude '.gitignore'

          # 删除复制进去的 Stop Motion 源代码
          rm -rf _site/projects/stop-motion-studio-github

          # 只放 Vite 编译后的正式网页
          mkdir -p _site/projects/stop-motion-studio-github
          cp -a projects/stop-motion-studio-github/dist/. \
            _site/projects/stop-motion-studio-github/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
