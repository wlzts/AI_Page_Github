name: Deploy AI_Page to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Stop Motion Studio
        working-directory: projects/stop-motion-studio-github
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build static Pages bundle
        run: |
          rm -rf _site
          mkdir -p _site/projects/stop-motion-studio-github

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'api/' \
            --exclude 'server-lib/' \
            --exclude 'package.json' \
            --exclude 'vercel.json' \
            --exclude '.env*' \
            --exclude '.gitignore' \
            --exclude 'projects/stop-motion-studio-github/'

          rsync -a projects/stop-motion-studio-github/dist/ _site/projects/stop-motion-studio-github/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
